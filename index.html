<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FOMO Desk">
  <title>FOMO Desk</title>
  <link rel="manifest" href="manifest.json?v=7">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="app.css?v=7">
</head>
<body>
  <div id="error-bar" class="error-bar" hidden></div>

  <main id="screen-home" class="screen is-active" data-screen="home">
    <header class="nav">
      <button type="button" class="avatar" id="home-avatar" aria-label="Account"></button>
      <div class="nav-title">Grok Bot <span class="chevron">›</span></div>
      <button type="button" class="icon-btn" id="home-search" aria-label="Search">⌕</button>
      <button type="button" class="icon-btn" id="home-bell" aria-label="Alerts"><span class="bell">⌾</span><span class="dot" id="bell-dot" hidden></span></button>
    </header>
    <section class="hero">
      <div class="balance-row">
        <div class="balance tabular" id="balance">—</div>
        <span class="pill paper" id="paper-badge">PAPER</span>
      </div>
      <div class="hero-meta">
        <span class="today tabular" id="today">—</span>
        <span class="pill multiplier tabular" id="multiplier" hidden></span>
      </div>
    </section>
    <div class="ranges" id="ranges" role="tablist">
      <button type="button" data-range="LIVE" class="is-on">LIVE</button>
      <button type="button" data-range="1H">1H</button>
      <button type="button" data-range="4H">4H</button>
      <button type="button" data-range="1D">1D</button>
      <button type="button" data-range="1W">1W</button>
      <button type="button" data-range="ALL">ALL</button>
    </div>
    <section class="chart-wrap">
      <canvas id="chart" width="390" height="180" aria-label="Balance chart"></canvas>
    </section>
    <section class="live-screen card" id="live-screen-card">
      <div class="live-frame" id="live-frame">
        <img id="live-img" alt="Live screen" hidden>
        <div class="live-placeholder" id="live-placeholder">Waiting for a frame</div>
        <div class="live-tl" id="live-age"><span class="led grey"></span> Last frame —</div>
        <div class="live-tr" id="live-owner">Idle</div>
      </div>
      <div class="live-last" id="live-last">No order yet</div>
    </section>
    <section class="block">
      <h2>Bots · <span id="bots-running">0 running</span></h2>
      <div class="carousel" id="bot-carousel"></div>
    </section>
    <section class="block">
      <div class="row-head">
        <h2>Trades</h2>
        <button type="button" class="text-link" id="trades-see-all">See all</button>
      </div>
      <ul class="rows" id="home-trades"></ul>
    </section>
  </main>

  <main id="screen-bots" class="screen" data-screen="bots" hidden>
    <header class="nav"><div class="nav-title">Bots</div></header>
    <div id="bots-full"></div>
  </main>

  <main id="screen-trades" class="screen" data-screen="trades" hidden>
    <header class="nav"><div class="nav-title">Trades</div></header>
    <div class="filters" id="trade-filters">
      <button type="button" class="chip is-on" data-filter-mode="all">All modes</button>
      <button type="button" class="chip" data-filter-mode="PAPER">PAPER</button>
      <button type="button" class="chip" data-filter-mode="REAL">REAL</button>
      <button type="button" class="chip is-on" data-filter-state="all">All</button>
      <button type="button" class="chip" data-filter-state="open">Open</button>
      <button type="button" class="chip" data-filter-state="closed">Closed</button>
    </div>
    <ul class="rows" id="trades-list"></ul>
    <p class="empty" id="trades-empty" hidden>No trades yet</p>
  </main>

  <main id="screen-account" class="screen" data-screen="account" hidden>
    <header class="nav"><div class="nav-title">Account</div></header>
    <section class="card account-mode">
      <div class="seg" id="mode-seg">
        <button type="button" data-mode="PAPER" class="is-on">PAPER</button>
        <button type="button" data-mode="LIVE">LIVE</button>
      </div>
      <div class="cash-line">Cash <span class="tabular" id="account-cash">—</span></div>
    </section>
    <section class="card links-card">
      <a class="row-link" id="profile-link" href="#" hidden>Your FOMO profile</a>
      <button type="button" class="row-link" id="invite-btn">Invite a friend</button>
      <p class="copied" id="invite-copied" hidden>Link copied</p>
    </section>
    <section class="card" id="settings-groups"></section>
    <section class="card">
      <div class="row-line">Pushes <span id="push-state">Plan B: Telegram only</span></div>
      <button type="button" class="row-link" id="test-push" disabled>Send test push</button>
    </section>
  </main>

  <main id="screen-audit" class="screen" data-screen="audit" hidden>
    <header class="nav">
      <button type="button" class="back" data-back>‹</button>
      <div class="nav-title">Audit</div>
    </header>
    <div id="audit-body"></div>
  </main>

  <main id="screen-coin" class="screen" data-screen="coin" hidden>
    <header class="nav">
      <button type="button" class="back" data-back>‹</button>
      <div class="nav-title" id="coin-title">Coin</div>
      <span class="pill paper" id="coin-paper">PAPER</span>
    </header>
    <div id="coin-body"></div>
  </main>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card">
      <h3 id="sheet-title">Sell now</h3>
      <div class="seg" id="sell-pcts">
        <button type="button" data-pct="25">25%</button>
        <button type="button" data-pct="50">50%</button>
        <button type="button" data-pct="100" class="is-on">100%</button>
      </div>
      <button type="button" class="primary" id="confirm-sell">Confirm sell</button>
      <button type="button" class="ghost" id="sheet-cancel">Cancel</button>
    </div>
  </div>

  <div id="search-overlay" class="overlay" hidden>
    <div class="search-box">
      <input id="search-input" type="search" placeholder="Name, symbol or mint" enterkeyhint="search">
      <button type="button" id="search-close">Cancel</button>
    </div>
    <ul class="rows" id="search-results"></ul>
  </div>

  <nav class="tabbar" aria-label="Tabs">
    <button type="button" class="tab is-on" data-tab="home">Home</button>
    <button type="button" class="tab" data-tab="bots">Bots</button>
    <button type="button" class="tab" data-tab="trades">Trades</button>
    <button type="button" class="tab" data-tab="account">Account</button>
  </nav>

  <script src="chart.js?v=7"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
